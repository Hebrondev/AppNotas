<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Categorías</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>
    <h:body>
        <h:form id="formCategoria">
            <p:growl id="mensajes" showSummary="true" showDetail="true"/>

            <p:panel header="Gestión de categorías">
                <p:outputLabel for="nombre" value="Nombre"/>
                <p:inputText id="nombre"
                             value="#{categoriaController.categoria.nombre}"
                             required="true"
                             requiredMessage="Campo requerido"/>
                <p:message for="nombre"/>

                <p:commandButton value="Guardar"
                                 actionListener="#{categoriaController.guardar}"
                                 update="@form"/>
                <p:commandButton value="Cancelar"
                                 actionListener="#{categoriaController.cancelar}"
                                 update="@form"
                                 immediate="true"/>
            </p:panel>

            <p:dataTable value="#{categoriaController.categorias}"
                         var="item"
                         emptyMessage="No hay categorías registradas">
                <p:column headerText="Nombre">
                    <h:outputText value="#{item.nombre}"/>
                </p:column>
                <p:column headerText="Estado">
                    <h:outputText value="#{item.estado ? 'Activa' : 'Inactiva'}"/>
                </p:column>
                <p:column headerText="Acciones">
                    <p:commandButton value="Editar"
                                     action="#{categoriaController.seleccionar(item)}"
                                     process="@this"
                                     update="@form"/>
                    <p:commandButton value="#{item.estado ? 'Desactivar' : 'Activar'}"
                                     action="#{categoriaController.cambiarEstado(item)}"
                                     process="@this"
                                     update="@form"/>
                </p:column>
            </p:dataTable>

            <h:link value="Volver" outcome="/protegido/principal"/>
        </h:form>
    </h:body>
</html>
